name: Portfolio agent

on:
  schedule:
    - cron: '17 3 * * *' # daily; odd minute — top-of-hour crons are delayed/dropped
  workflow_dispatch:
    inputs:
      repo:
        description: 'Only process this repo (name only, e.g. tender-copilot); bypasses the topic filter'
        required: false
      dry_run:
        description: 'Draft and validate but do not push a branch or open a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: portfolio-agent
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Draft new project pages
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          node agent/draft-project.mjs
          ${{ inputs.repo && format('--repo {0}', inputs.repo) || '' }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
