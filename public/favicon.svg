  <g transform="rotate(-6 32 32)">
    <rect x="12" y="10" width="40" height="44" fill="#f7f5ee"/>
    <rect x="16" y="14" width="32" height="28" fill="#8a6a46"/>
    <rect x="16" y="14" width="32" height="28" fill="none" stroke="#c9c4b5" stroke-width="1"/>
    <line x1="18" y1="48" x2="40" y2="48" stroke="#2e2b23" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
